
apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-frontend
  namespace: ems

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee-frontend

  template:
    metadata:
      labels:
        app: employee-frontend

    spec:
      containers:
        - name: employee-frontend
          image: employee-frontend:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
