<div class="dashboard-container">

    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Employee analytics and statistics</p>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards">

        <div class="summary-card">
            <h3>Total Employees</h3>
            <h2>{{ totalEmployees }}</h2>
        </div>

        <div class="summary-card">
            <h3>Departments</h3>
            <h2>{{ totalDepartments }}</h2>
        </div>

        <div class="summary-card">
            <h3>Active Employees</h3>
            <h2>{{ activeEmployees }}</h2>
        </div>

        <div class="summary-card">
            <h3>On Leave</h3>
            <h2>{{ employeesOnLeave }}</h2>
        </div>

    </div>

    <!-- Employee Growth Chart -->
    <div class="chart-card full-width">
        <h2>Employee Growth</h2>

        <div class="chart-container">
            <canvas baseChart [type]="'line'" [data]="lineChartData" [options]="lineChartOptions">
            </canvas>
        </div>
    </div>

    <!-- Pie and Doughnut Charts -->
    <div class="chart-grid">

        <div class="chart-card">
            <h2>Department Distribution</h2>

            <div class="chart-container">
                <canvas baseChart [type]="'pie'" [data]="pieChartData" [options]="pieChartOptions">
                </canvas>
            </div>
        </div>

        <div class="chart-card">
            <h2>Employee Status</h2>

            <div class="chart-container">
                <canvas baseChart [type]="'doughnut'" [data]="doughnutChartData" [options]="doughnutChartOptions">
                </canvas>
            </div>
        </div>

    </div>

    <!-- Bar Chart -->
    <div class="chart-card full-width">
        <h2>Employees by Department</h2>

        <div class="chart-container">
            <canvas baseChart [type]="'bar'" [data]="barChartData" [options]="barChartOptions">
            </canvas>
        </div>
    </div>

</div>
